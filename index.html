<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hans Nyblom | Digitalisering och affärsutveckling</title>
<meta name="description" content="Hans Nyblom gör komplexa samband begripliga. Digitalisering och affärsutveckling.">
<style>
  :root { --ink:#1d2a33; --muted:#5b6b75; --accent:#0f6e56; --bg:#f6f4ef; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  main { max-width:640px; }
  .tag { font-family: system-ui, sans-serif; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h1 { font-size:clamp(2.4rem, 7vw, 4rem); font-weight:normal; line-height:1.1; margin:.6rem 0 1.2rem; }
  p { font-size:1.25rem; line-height:1.6; color:var(--muted); }
  .line { width:64px; height:3px; background:var(--accent); margin:2rem 0; }
  small { font-family: system-ui, sans-serif; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <div class="tag">Digitalisering och affärsutveckling</div>
  <h1>Hans Nyblom</h1>
  <p>Jag gör komplexa samband begripliga och omsätter dem i tydliga modeller som går att agera på.</p>
  <div class="line"></div>
  <small>Den nya hemsidan byggs just nu. Välkommen tillbaka snart.</small>
</main>
</body>
</html>
